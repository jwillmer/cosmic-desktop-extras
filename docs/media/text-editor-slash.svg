trl + Shift + 2</text><text x="68" y="356.0" font-size="13" fill="#e6e6e6">Heading 3</text><text x="322" y="355.0" font-size="11" fill="#a3a3a3" text-anchor="end" style="font-family:'Noto Sans Mono', 'DejaVu Sans Mono', monospace;white-space:pre">Ctrl + Shift + 3</text><text x="68" y="388.0" font-size="13" fill="#e6e6e6">Bulleted list</text><text x="322" y="387.0" font-size="11" fill="#a3a3a3" text-anchor="end" style="font-family:'Noto Sans Mono', 'DejaVu Sans Mono', monospace;white-space:pre">-</text><text x="68" y="420.0" font-size="13" fill="#e6e6e6">Numbered list</text><text x="322" y="419.0" font-size="11" fill="#a3a3a3" text-anchor="end" style="font-family:'Noto Sans Mono', 'DejaVu Sans Mono', monospace;white-space:pre">1.</text><rect x="56" y="431" width="278" height="32" rx="8" fill="#ffffff" fill-opacity=".09"/><text x="68" y="452.0" font-size="13" fill="#e6e6e6">Task list</text><text x="322" y="451.0" font-size="11" fill="#a3a3a3" text-anchor="end" style="font-family:'Noto Sans Mono', 'DejaVu Sans Mono', monospace;white-space:pre">Ctrl + Enter</text><text x="68" y="484.0" font-size="13" fill="#e6e6e6">Quote</text><text x="322" y="483.0" font-size="11" fill="#a3a3a3" text-anchor="end" style="font-family:'Noto Sans Mono', 'DejaVu Sans Mono', monospace;white-space:pre">&gt;</text><text x="68" y="516.0" font-size="13" fill="#e6e6e6">Code block</text><text x="322" y="515.0" font-size="11" fill="#a3a3a3" text-anchor="end" style="font-family:'Noto Sans Mono', 'DejaVu Sans Mono', monospace;white-space:pre">```</text><rect x="336" y="275" width="2.5" height="120.60000000000001" rx="1.25" fill="#ffffff" fill-opacity=".25"/><path d="M240 449l0 17 4.5-4.2 3 6.6 2.6-1.2-3-6.4 6-.4z" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/><text x="466" y="346" font-size="15" fill="#ffffff" font-weight="600">Type / at the start of a line</text><text x="466" y="374" font-size="13" fill="#a3a3a3">Type to filter: /h2, /todo, /table</text><text x="466" y="396" 