<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-label="Taskbar right-click menu and the Move to workspace page"><title>Taskbar right-click menu and the Move to workspace page</title><defs><linearGradient id="gBrowser" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fb4f5"/><stop offset="1" stop-color="#1c63b8"/></linearGradient><linearGradient id="gMusic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#e0447a"/></linearGradient><linearGradient id="gWall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d2433"/><stop offset=".55" stop-color="#1a1d2b"/><stop offset="1" stop-color="#2a1f33"/></linearGradient><radialGradient id="gGlow1" cx=".18" cy=".2" r=".55"><stop offset="0" stop-color="#2f5d8a" stop-opacity=".55"/><stop offset="1" stop-color="#2f5d8a" stop-opacity="0"/></radialGradient><radialGradient id="gGlow2" cx=".85" cy=".1" r=".5"><stop offset="0" stop-color="#6b3f7a" stop-opacity=".45"/><stop offset="1" stop-color="#6b3f7a" stop-opacity="0"/></radialGradient><clipPath id="cAll"><rect width="880" height="360" rx="14"/></clipPath></defs><style>text{font-family:Inter, 'Open Sans', 'Noto Sans', sans-serif}</style><g clip-path="url(#cAll)"><rect width="880" height="360" fill="#141414"/><rect width="880" height="360" fill="url(#gWall)"/><rect width="880" height="360" fill="url(#gGlow1)"/><rect width="880" height="360" fill="url(#gGlow2)"/><text x="84" y="56" font-size="13" fill="#a3a3a3" font-weight="500">Right-click a window in the taskbar</text><rect x="80" y="76" width="280" height="218" rx="12" fill="#000" opacity=".35"/><rect x="80" y="70" width="280" height="218" rx="12" fill="#262626" stroke="#ffffff" stroke-opacity=".09"/><text x="98" y="99" font-size="14" fill="#e6e6e6">New window</text><rect x="92" y="118" width="256" height="1" fill="#ffffff" fill-opacity=".1"/><text x="98" y="148" font-size="14" fill="#e6e6e6">Minimize</text><text x="98" y="184" font-size="14" fill="#e6e6e6">Maximize</text><rect x="86" y="197" width="268" height="36" rx="8" fill="#ffffff" fill-opacity=".09"/><text x="98" y="220" font-size="14" fill="#e6e6e6">Move to workspace</text><path d="M336 209l6 6-6 6" fill="none" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="92" y="239" width="256" height="1" fill="#ffffff" fill-opacity=".1"/><text x="98" y="269" font-size="14" fill="#e6e6e6">Close window</text><text x="342" y="269" font-size="12" fill="#a3a3a3" text-anchor="end">middle-click</text><text x="524" y="56" font-size="13" fill="#a3a3a3" font-weight="500">Move to workspace</text><rect x="520" y="76" width="280" height="205" rx="12" fill="#000" opacity=".35"/><rect x="520" y="70" width="280" height="205" rx="12" fill="#262626" stroke="#ffffff" stroke-opacity=".09"/><path d="M545 88l-6 6 6 6" fill="none" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="99" font-size="14" fill="#e6e6e6">Back</text><rect x="532" y="118" width="256" height="1" fill="#ffffff" fill-opacity=".1"/><text x="560" y="148" font-size="14" fill="#e6e6e6">Workspace 1</text><path d="M538 179l4 4 8-9" fill="none" stroke="#5aa9f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="184" font-size="14" fill="#5aa9f0" font-weight="500">Work</text><text x="782" y="184" font-size="12" fill="#5aa9f0" text-anchor="end" opacity="0.8">current</text><text x="560" y="220" font-size="14" fill="#e6e6e6">Music</text><text x="560" y="256" font-size="14" fill="#e6e6e6">Workspace 4</text><path d="M376 215.0H498" stroke="#5aa9f0" stroke-width="2" stroke-dasharray="1 0" fill="none"/><path d="M492 209.0l7 6-7 6" fill="none" stroke="#5aa9f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="440.0" y="203.0" font-size="12" fill="#a3a3a3" text-anchor="middle">switches the menu</text><text x="524" y="301" font-size="12" fill="#a3a3a3">The current workspace keeps its place,</text><text x="524" y="317" font-size="12" fill="#a3a3a3">so the entries never shift.</text></g></svg>
