<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-label="Taskbar right-click menu with Always open on Work, and a pin on the icon of an app pinned to a workspace"><title>Taskbar right-click menu with Always open on Work, and a pin on the icon of an app pinned to a workspace</title><defs><linearGradient id="gBrowser" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fb4f5"/><stop offset="1" stop-color="#1c63b8"/></linearGradient><linearGradient id="gMusic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#e0447a"/></linearGradient><linearGradient id="gWall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d2433"/><stop offset=".55" stop-color="#1a1d2b"/><stop offset="1" stop-color="#2a1f33"/></linearGradient><radialGradient id="gGlow1" cx=".18" cy=".2" r=".55"><stop offset="0" stop-color="#2f5d8a" stop-opacity=".55"/><stop offset="1" stop-color="#2f5d8a" stop-opacity="0"/></radialGradient><radialGradient id="gGlow2" cx=".85" cy=".1" r=".5"><stop offset="0" stop-color="#6b3f7a" stop-opacity=".45"/><stop offset="1" stop-color="#6b3f7a" stop-opacity="0"/></radialGradient><symbol id="i-browser" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="url(#gBrowser)"/><g fill="none" stroke="#fff" stroke-width="1.6" opacity=".95"><circle cx="16" cy="16" r="9"/><ellipse cx="16" cy="16" rx="4" ry="9"/><path d="M7 16h18M8.6 11.5h14.8M8.6 20.5h14.8"/></g></symbol><symbol id="i-term" viewBox="0 0 32 32"><rect x="3" y="4" width="26" height="24" rx="5" fill="#2d323a" stroke="#4b525c"/><path d="M9 12l4.5 4L9 20" fill="none" stroke="#7ee787" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 21h7" stroke="#7ee787" stroke-width="2.2" stroke-linecap="round"/></symbol><symbol id="i-folder" viewBox="0 0 32 32"><path d="M3 8a2 2 0 0 1 2-2h7l3 3h12a2 2 0 0 1 2 2v2H3z" fill="#d99a2b"/><rect x="3" y="11" width="26" height="16" rx="2.5" fill="#f