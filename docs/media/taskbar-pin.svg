xt x="244" y="347" font-size="12" fill="#e6e6e6" opacity="0.75">3 unread</text><circle cx="235" cy="324" r="7.5" fill="#1e1e1e"/><g transform="translate(229 318) scale(1.0) rotate(40 6 6)" fill="#e6e6e6"><path d="M3.6 .8h4.8v1.4l-.9.6v3l2 1.6v1.1H2.5V7.4l2-1.6v-3l-.9-.6z"/><rect x="5.4" y="8.4" width="1.2" height="3.4" rx=".6"/></g><rect x="374" y="314" width="172" height="40" rx="8" fill="#004881"/><use href="#i-term" x="382" y="321.0" width="26" height="26"/><text x="416" y="331" font-size="14" fill="#ffffff" font-weight="500">build.sh</text><text x="416" y="347" font-size="12" fill="#ffffff" opacity="0.75">~/projects/demo</text><rect x="552" y="314" width="140" height="40" rx="8" fill="#ffffff" fill-opacity=".1"/><use href="#i-mail" x="560" y="321.0" width="26" height="26"/><text x="594" y="331" font-size="14" fill="#e6e6e6">Inbox</text><text x="594" y="347" font-size="12" fill="#e6e6e6" opacity="0.75">5 unread</text><rect x="562.0" y="58" width="270" height="242" rx="12" fill="#000" opacity=".35"/><rect x="562.0" y="52" width="270" height="242" rx="12" fill="#262626" stroke="#ffffff" stroke-opacity=".09"/><text x="580.0" y="80.0" font-size="13" fill="#e6e6e6">New window</text><rect x="574.0" y="98" width="246" height="1" fill="#ffffff" fill-opacity=".1"/><text x="580.0" y="127.0" font-size="13" fill="#e6e6e6">Minimize</text><text x="580.0" y="161.0" font-size="13" fill="#e6e6e6">Maximize</text><text x="580.0" y="195.0" font-size="13" fill="#e6e6e6">Move to workspace</text><path d="M810.0 185.0l5 5-5 5" fill="none" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="568.0" y="207" width="258" height="34" rx="8" fill="#ffffff" fill-opacity=".09"/><text x="580.0" y="229.0" font-size="13" fill="#e6e6e6">Always open on “Work”</text><rect x="574.0" y="247" width="246" height="1" fill="#ffffff" fill-opacity=".1"/><text x="580.0" y="276.0" font-size="13" fill="#e6e6e6">Close window</text><text x="814.0" y="276" font-size="12" fill="#a3a3a3" text-anchor="end">middle-click</text><path d="M762.0 227l0 17 4.5-4.2 3 6.6 2.6-1.2-3-6.4 6-.4z" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/><text x="36" y="40" font-size="15" fill="#ffffff" font-weight="600">Pin an app to a workspace</text><text x="36" y="66" font-size="12.5" fill="#a3a3a3">Right-click a window, choose “Always open on …”.</text><text x="36" y="86" font-size="12.5" fill="#a3a3a3">Its new windows open on that workspace,</text><text x="36" y="106" font-size="12.5" fill="#a3a3a3">and starting it from anywhere takes you there.</text><text x="36" y="126" font-size="12.5" fill="#a3a3a3">With Workspace Keeper installed.</text><text x="235" y="205" font-size="12" fill="#a3a3a3" text-anchor="middle">pinned app</text><path d="M235 213V313" stroke="#8a8a8a" stroke-width="1"/><circle cx="235" cy="313" r="2.4" fill="#8a8a8a"/></g></svg>
